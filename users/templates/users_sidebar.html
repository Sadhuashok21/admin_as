{% load static %}
<div class="upbar">

    <div class="upbar_con">
        <div class="upbar_grid">
            <svg  width="16" height="16" fill="currentColor" class="as as-list" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
            </svg>
        </div>
    
        <div class="upbar_profile">
            <img src="{% static 'images/as_logo.webp' %}" alt="logo" class="upbar_profile_img">
            <h1 class="heading">AS.</h1>
        </div>
    </div>
    
    
    <div class="upbar_icons">
    
        <div class="dark_mode">
            <svg width="16" height="16" fill="currentColor" class="as as-moon active" viewBox="0 0 16 16">

            </svg>
    
            <svg width="16" height="16" fill="currentColor" class="as as-moon-fill" viewBox="0 0 16 16">
                <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>

        </div>
    
        <div class="upbar_notification">
            <span class="notification_red">12</span>
                
            <svg  width="16" height="16" fill="currentColor" class="as as-bell" viewBox="0 0 16 16">
                <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
            </svg>
    
        </div>
    
    
        <div class="upbar_profile">
            <img src="{% static 'images/as_logo.webp' %}" alt="logo" class="upbar_profile_img">
    
        </div>
    
        
    </div>
    
    
</div>


<div class="sidebar">

    <div class="heading" onclick="window.location.href='{% url 'home'%}'">
        <svg width="16" height="16" fill="currentColor" class="as as-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
        </svg>
        <h1>Users</h1>
    </div>

</div>

<script src="{% static 'js/sidebar.js' %}">
</script>
